<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚡ Code Arena – Robot Coding</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>

<style>
/* CSS giữ nguyên tông màu dịu mắt */
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#EEF2F6;--surface:#FFFFFF;--surface2:#E4ECF4;--accent:#3B82F6;--accent2:#2563EB;--green:#10B981;--red:#EF4444;--text:#1E293B;--muted:#64748B;--border:#CBD5E1;--shadow:rgba(59,130,246,.10);}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}
.bg-deco{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(59,130,246,.08),transparent 70%)}
.bg-deco::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(20,184,166,.08),transparent 70%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:12px 12px 80px}
.header{text-align:center;padding:14px 0 6px}
.logo{font-size:24px;font-weight:900;background:linear-gradient(135deg,#3B82F6,#14B8A6);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.timer-bar{position:fixed;top:0;left:0;width:100%;height:5px;background:var(--border);z-index:100}
.timer-fill{height:100%;background:linear-gradient(90deg,#3B82F6,#14B8A6);transition:width 1s linear;border-radius:0 2px 2px 0}
.timer-display{position:fixed;top:8px;right:12px;z-index:101;background:rgba(255,255,255,.95);border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--accent);box-shadow:0 2px 8px var(--shadow)}
.arena{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}
.robot-wrap{flex-shrink:0;position:relative}
.robot-wrap svg{width:68px;height:84px;filter:drop-shadow(0 4px 12px rgba(59,130,246,.2))}
.card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px var(--shadow)}
.card-title{font-size:14px;font-weight:800;text-transform:uppercase;margin-bottom:12px}
.tab-row{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;text-align:center;transition:.2s}
.tab.active{border-color:var(--accent);color:var(--accent);background:rgba(59,130,246,.08)}
.question-badge{display:inline-block;background:linear-gradient(135deg,rgba(59,130,246,.15),rgba(20,184,166,.15));color:var(--accent2);border-radius:10px;padding:4px 12px;font-size:11px;font-weight:800;margin-bottom:10px}
.question-text{font-size:14px;line-height:1.65;margin-bottom:12px}
.editor-wrap{position:relative}
.editor-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Fira Code',monospace;font-weight:600}
textarea{width:100%;min-height:120px;background:#F8FAFC;border:1.5px solid var(--border);border-radius:12px;font-family:'Fira Code',monospace;font-size:13px;padding:12px;resize:vertical;outline:none}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,130,246,.1)}
.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:.2s}
.btn-primary{background:linear-gradient(135deg,#3B82F6,#2563EB);color:#fff;box-shadow:0 4px 16px rgba(59,130,246,.3)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed}
.btn-secondary{background:var(--surface2);color:var(--text);border:1.5px solid var(--border)}
.btn-next{background:linear-gradient(135deg,var(--green),#059669);color:#fff;}
.btn-teacher{background:linear-gradient(135deg,#8B5CF6,#6D28D9);color:#fff;}
.result-box{border-radius:14px;padding:14px;margin-top:10px;display:none}
.result-box.show{display:block}
.result-box.pass{background:rgba(16,185,129,.08);border:1.5px solid rgba(16,185,129,.25)}
.result-box.fail{background:rgba(239,68,68,.08);border:1.5px solid rgba(239,68,68,.25)}
.name-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;margin-bottom:10px}
.name-input:focus{border-color:var(--accent);}
.lb-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;}
.lb-rank{font-size:16px;width:28px;text-align:center}
.lb-name{flex:1;font-weight:700;font-size:14px;}
.lb-score{font-weight:900;font-size:16px;color:var(--accent)}
.finish-banner{text-align:center;padding:20px 16px}
.total-score{font-size:56px;font-weight:900;color:#3B82F6}
.player-robo-card{background:var(--surface);border:2px solid var(--border);border-radius:16px;padding:14px 8px;text-align:center;box-shadow:0 4px 10px var(--shadow)}
.wait-room{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px;margin:12px 0}
.teacher-grid{display:grid;grid-template-columns:1fr;gap:10px;}
.status-badge{font-size:11px;padding:2px 8px;border-radius:10px;font-weight:700;}
.status-waiting{background:#F1F5F9; color:#64748B;}
.status-ready{background:#D1FAE5; color:#059669;}
.countdown-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(238,242,246,.95);z-index:200;display:flex;align-items:center;justify-content:center;}
.countdown-num{font-size:120px;font-weight:900;color:var(--accent);animation:count-pop .8s ease-out;}
@keyframes count-pop{0%{transform:scale(2);opacity:0}60%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.robot-bounce{animation:bounce 2s ease-in-out infinite}
</style>
</head>
<body>

<div class="timer-bar"><div class="timer-fill" id="timerFill" style="width:100%"></div></div>
<div class="timer-display" id="timerDisplay" style="display:none">⏱ 5:00</div>
<div class="bg-deco"></div>

<div id="app">
  <div class="header">
    <div class="logo">⚡ Code Arena</div>
    <div class="subtitle">Học Vui · Chấm Nhanh · Lên Bảng Vàng 🏆</div>
  </div>
  <div class="arena" id="arena-robots"></div>
  <div id="main-content"></div>
</div>

<script>
// ========================================================
// 1. CẤU HÌNH FIREBASE (THAY THÔNG TIN CỦA BẠN VÀO ĐÂY)
// ========================================================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY", 
  authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT_ID",
  storageBucket: "YOUR_PROJECT_ID.appspot.com",
  messagingSenderId: "YOUR_SENDER_ID",
  appId: "YOUR_APP_ID"
};

// Khởi tạo Firebase
if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
}
const db = firebase.database();
const roomRef = db.ref('CodeArenaRoom'); // Tên phòng thi đấu chung

// ========================================================
// 2. BIẾN TRẠNG THÁI (STATE)
// ========================================================
const TOTAL_SECONDS = 300; 
const questions = [
  { title:'Câu 1: Hàm tính tổng', desc:'Viết hàm <code>sum(a, b)</code> nhận 2 tham số là số, trả về tổng của 2 số.', placeholder:'function sum(a, b) {\n  \n}' },
  { title:'Câu 2: Giới thiệu', desc:'Dùng <code>console.log()</code> để in ra Tên của bạn.', placeholder:'// Viết code ở đây\n' }
];

let localState = {
  screen: 'name', playerName: '', isTeacher: false,
  currentQ: 0, codes: ['',''], scores: [null,null], timerInterval: null
};

// ========================================================
// 3. LẮNG NGHE DỮ LIỆU THỜI GIAN THỰC TỪ FIREBASE
// ========================================================
let globalState = { status: 'idle', players: {}, leaderboard: {} };

roomRef.on('value', (snapshot) => {
  const data = snapshot.val();
  if (data) {
    globalState = data;
    if (!globalState.players) globalState.players = {};
    if (!globalState.leaderboard) globalState.leaderboard = {};
    handleDBChange();
  }
});

function handleDBChange() {
  // Học sinh đang ở phòng chờ -> Giáo viên bấm bắt đầu -> Đếm ngược
  if (localState.screen === 'waiting' && globalState.status === 'playing') {
    startCountdown();
  }
  // Nếu là giáo viên, tự động cập nhật bảng xếp hạng / phòng chờ
  if (localState.isTeacher) {
    renderTeacherScreen(); 
  }
  // Nếu đang ở phòng chờ, cập nhật danh sách người chờ
  if (localState.screen === 'waiting') {
    renderWaitingRoom();
  }
}

// ========================================================
// 4. MOCK AI (CHẤM ĐIỂM GIẢ LẬP)
// ========================================================
async function mockGradeCode(code, qIdx) {
  await new Promise(res => setTimeout(res, 1200)); 
  code = code.toLowerCase();
  let score = 0, fb = '';
  
  if(qIdx === 0) {
    if(code.includes('return') && (code.includes('a+b') || code.includes('a + b'))) { score = 10; fb = 'Xuất sắc!'; } 
    else if(code.includes('+')) { score = 6; fb = 'Thiếu từ khóa return.'; } 
    else { score = 2; fb = 'Chưa đúng logic tính tổng.'; }
  } else {
    if(code.includes('console.log')) { score = 10; fb = 'Tuyệt vời!'; } 
    else { score = 2; fb = 'Phải sử dụng console.log()'; }
  }
  return { score, pass: score >= 5, feedback: fb };
}

// ========================================================
// GIAO DIỆN & LOGIC CÁC MÀN HÌNH
// ========================================================
function renderRobots() {
  const svg = `<svg viewBox="0 0 64 84" fill="none" class="robot-bounce"><rect x="10" y="7" width="44" height="32" rx="10" fill="#E4ECF4" stroke="#3B82F6" stroke-width="2"/><circle cx="24" cy="22" r="4" fill="#3B82F6"/><circle cx="40" cy="22" r="4" fill="#3B82F6"/><rect x="22" y="33" width="20" height="4" rx="2" fill="#14B8A6"/><rect x="8" y="39" width="48" height="28" rx="10" fill="#E4ECF4" stroke="#3B82F6" stroke-width="2"/></svg>`;
  document.getElementById('arena-robots').innerHTML = `<div class="robot-wrap">${svg}</div><div style="flex:1;text-align:center;font-weight:900;color:var(--accent);align-self:center">Code Arena</div><div class="robot-wrap" style="transform:scaleX(-1)">${svg}</div>`;
}

// ---- MÀN HÌNH 1: NHẬP TÊN ----
function renderNameScreen() {
  localState.screen = 'name';
  renderRobots();
  document.getElementById('timerDisplay').style.display = 'none';
  document.getElementById('main-content').innerHTML = `
  <div class="card">
    <div class="card-title">🤖 Đăng ký thi đấu</div>
    <input class="name-input" id="nameInput" placeholder="Tên của bạn..." maxlength="20"/>
    <button class="btn btn-primary" style="width:100%" onclick="joinGame()">🚀 Vào phòng chờ</button>
  </div>
  <div style="text-align:center; margin-top:20px;">
    <button class="btn btn-teacher" style="padding:8px 16px; font-size:12px" onclick="enterTeacherMode()">👨‍🏫 Chế độ Giáo viên</button>
  </div>`;
}

function joinGame() {
  const name = document.getElementById('nameInput').value.trim();
  if(!name) return;
  localState.playerName = name;
  localState.isTeacher = false;
  
  // Đẩy tên học sinh lên Firebase
  roomRef.child('players/' + name).set({ score: 0, status: 'ready' });
  
  localState.screen = 'waiting';
  renderWaitingRoom();
}

// ---- MÀN HÌNH 2: PHÒNG CHỜ ----
function renderWaitingRoom() {
  if(localState.screen !== 'waiting') return;
  const players = Object.keys(globalState.players || {});
  
  document.getElementById('main-content').innerHTML = `
  <div class="card">
    <h2 style="font-size:18px; color:var(--accent); text-align:center;">Đang chờ giáo viên...</h2>
    <div class="wait-room">
      ${players.map(p => `
        <div class="player-robo-card">
          <div style="font-size:24px">🧑‍💻</div>
          <div style="font-weight:700; font-size:13px">${p}</div>
          <span class="status-badge status-ready">Sẵn sàng</span>
        </div>
      `).join('')}
    </div>
  </div>`;
}

// ---- MÀN HÌNH 3: GIÁO VIÊN ----
function enterTeacherMode() {
  localState.isTeacher = true; localState.screen = 'teacher';
  renderTeacherScreen();
}

function renderTeacherScreen() {
  const players = Object.entries(globalState.players || {});
  document.getElementById('main-content').innerHTML = `
  <div class="card" style="border-color:var(--accent2)">
    <div class="card-title">👨‍🏫 Bảng điều khiển Giáo viên</div>
    <div style="display:flex; gap:10px; margin-bottom:15px">
      <button class="btn btn-next" style="flex:2" onclick="teacherStartAll()">▶ Bắt đầu chơi</button>
      <button class="btn btn-secondary" style="flex:1" onclick="teacherReset()">🔄 Xóa Đặt lại</button>
    </div>
    <h4 style="font-size:12px; color:var(--muted); margin-bottom:10px">TÌNH TRẠNG HỌC SINH (${players.length})</h4>
    <div class="teacher-grid">
      ${players.length === 0 ? '<div style="font-size:12px">Chưa có học sinh...</div>' : ''}
      ${players.map(([name, data]) => `
        <div class="lb-row">
          <div class="lb-name">${name}</div>
          <div style="font-size:12px; font-weight:bold; color:var(--accent)">Điểm: ${data.score}</div>
          <span class="status-badge status-${data.status==='ready'?'ready':'waiting'}">${data.status==='ready'?'Sẵn sàng':'Đang code'}</span>
        </div>
      `).join('')}
    </div>
  </div>
  <button class="btn btn-secondary" style="width:100%" onclick="renderNameScreen()">Về trang chủ</button>`;
}

function teacherStartAll() { roomRef.child('status').set('playing'); }
function teacherReset() { 
  if(confirm("Xóa tất cả?")) roomRef.set({ status: 'idle', players: null, leaderboard: null }); 
}

// ---- MÀN HÌNH 4: ĐẾM NGƯỢC & GAME ----
function startCountdown() {
  localState.screen = 'game';
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay'; overlay.id = 'countdownOverlay';
  overlay.innerHTML = `<div class="countdown-num" id="countNum">3</div>`;
  document.body.appendChild(overlay);

  let n = 3;
  const tick = setInterval(() => {
    n--;
    if(n > 0) document.getElementById('countNum').textContent = n;
    else {
      clearInterval(tick); document.getElementById('countNum').textContent = 'Code!';
      setTimeout(() => { overlay.remove(); renderGameScreen(); startTimer(); }, 800);
    }
  }, 1000);
}

function renderGameScreen() {
  const q = questions[localState.currentQ];
  document.getElementById('arena-robots').innerHTML = '';
  document.getElementById('main-content').innerHTML = `
  <div class="tab-row">
    ${questions.map((_, i) => `<button class="tab ${i===localState.currentQ?'active':''}" onclick="switchQ(${i})">Câu ${i+1}</button>`).join('')}
  </div>
  <div class="card">
    <div class="question-badge">${q.title}</div>
    <div class="question-text">${q.desc}</div>
    <div class="editor-wrap">
      <div class="editor-label">💻 Viết code của bạn ở đây:</div>
      <textarea id="codeEditor" placeholder="${q.placeholder}">${localState.codes[localState.currentQ]}</textarea>
    </div>
    <div id="result-area"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="submitBtn" onclick="submitCode()">🚀 Chấm Điểm</button>
    </div>
    ${localState.currentQ === questions.length - 1 ? 
      `<button class="btn btn-next" style="width:100%; margin-top:10px" onclick="finishGame()">🏁 Nộp bài và Kết thúc</button>` : 
      `<button class="btn btn-secondary" style="width:100%; margin-top:10px" onclick="switchQ(${localState.currentQ + 1})">Chuyển câu tiếp theo ➡️</button>`}
  </div>`;
  showStoredResult();
}

function switchQ(idx) {
  if(document.getElementById('codeEditor')) localState.codes[localState.currentQ] = document.getElementById('codeEditor').value;
  localState.currentQ = idx; renderGameScreen();
}

async function submitCode() {
  localState.codes[localState.currentQ] = document.getElementById('codeEditor').value;
  const btn = document.getElementById('submitBtn');
  btn.innerText = "🤖 Đang chấm..."; btn.disabled = true;

  const result = await mockGradeCode(localState.codes[localState.currentQ], localState.currentQ);
  localState.scores[localState.currentQ] = result.score;
  
  document.getElementById('result-area').innerHTML = `
    <div class="result-box show ${result.pass ? 'pass' : 'fail'}">
      <h3 style="color:${result.pass?'var(--green)':'var(--red)'}; margin-bottom:5px">Điểm: ${result.score}/10</h3>
      <p style="font-size:13px">${result.feedback}</p>
    </div>
  `;
  
  // Cập nhật điểm lên Firebase cho giáo viên xem Realtime
  const totalScore = localState.scores.reduce((a,b)=>(a||0)+(b||0), 0);
  roomRef.child('players/' + localState.playerName).update({ score: totalScore, status: 'coding' });

  btn.innerText = "🚀 Chấm lại"; btn.disabled = false;
}

function showStoredResult() {
  const sc = localState.scores[localState.currentQ];
  if(sc !== null) {
    document.getElementById('result-area').innerHTML = `<div class="result-box show ${sc>=5 ? 'pass' : 'fail'}"><h3 style="color:${sc>=5?'var(--green)':'var(--red)'}">Điểm hiện tại: ${sc}/10</h3></div>`;
  }
}

// ---- KẾT THÚC & LEADERBOARD ----
function finishGame() {
  clearInterval(localState.timerInterval);
  const totalScore = localState.scores.reduce((a,b)=>(a||0)+(b||0), 0);
  
  // Đẩy điểm lên Leaderboard chung trên Firebase
  roomRef.child('leaderboard/' + localState.playerName).set(totalScore);

  renderFinishScreen(totalScore);
}

function renderFinishScreen(score) {
  localState.screen = 'finish';
  document.getElementById('timerDisplay').style.display = 'none';
  
  // Chuyển Object bảng xếp hạng thành Mảng và Sắp xếp
  const lbArray = Object.entries(globalState.leaderboard || {})
                        .map(([name, sc]) => ({ name, score: sc }))
                        .sort((a,b) => b.score - a.score);
  
  const rank = lbArray.findIndex(p => p.name === localState.playerName) + 1;

  document.getElementById('main-content').innerHTML = `
  <div class="card finish-banner">
    <div style="font-size:50px">🏆</div>
    <div class="total-score" style="font-size:40px">${score} Điểm</div>
    <p style="color:var(--muted); font-weight:bold; margin-bottom:20px">Hoàn thành! Bạn đang xếp Hạng #${rank || '?'}</p>
    <button class="btn btn-secondary" onclick="location.reload()">Trở về trang chủ</button>
  </div>
  <div class="card">
    <div class="card-title">Bảng Xếp Hạng Lớp</div>
    <div>
      ${lbArray.map((p, i) => `
        <div class="lb-row" style="${p.name===localState.playerName ? 'border-color:var(--accent); background:rgba(59,130,246,0.1)':''}">
          <div class="lb-rank">#${i+1}</div>
          <div class="lb-name">${p.name} ${p.name===localState.playerName?'(Bạn)':''}</div>
          <div class="lb-score">${p.score}</div>
        </div>
      `).join('')}
    </div>
  </div>`;
}

function startTimer() {
  let timeLeft = TOTAL_SECONDS;
  const disp = document.getElementById('timerDisplay'), fill = document.getElementById('timerFill');
  disp.style.display = 'block';
  
  localState.timerInterval = setInterval(() => {
    timeLeft--;
    disp.textContent = `⏱ ${Math.floor(timeLeft/60)}:${String(timeLeft%60).padStart(2,'0')}`;
    fill.style.width = (timeLeft/TOTAL_SECONDS*100)+'%';
    if(timeLeft <= 0) finishGame();
  }, 1000);
}

// Khởi chạy giao diện ban đầu
renderNameScreen();
</script>
</body>
</html>
