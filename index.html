<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>⚡ Code Arena – Robot Coding</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#F1F7FC;
  --surface:#FFFFFF;
  --surface2:#EAF3FA;
  --surface3:#DCEAF6;
  --accent:#0B5FA5;
  --accent2:#1380C9;
  --warm:#1380C9;
  --gold:#C6922E;
  --green:#1E8449;
  --green2:#166238;
  --red:#C0392B;
  --blue:#0B5FA5;
  --teal:#0E7C76;
  --text:#0B2942;
  --muted:#4D7A9C;
  --border:#CFE0F0;
  --shadow:rgba(11,95,165,.10);
  --teacher:#2C4A86;
  --teacher2:#1B355F;
}
body{background:var(--bg);color:var(--text);font-family:'Nunito',sans-serif;min-height:100vh;overflow-x:hidden}

/* Warm decorative background */
.bg-deco{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0;overflow:hidden}
.bg-deco::before{content:'';position:absolute;top:-100px;right:-100px;width:400px;height:400px;border-radius:50%;background:radial-gradient(circle,rgba(19,128,201,.12),transparent 70%)}
.bg-deco::after{content:'';position:absolute;bottom:-80px;left:-80px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(30,132,73,.10),transparent 70%)}
.bubble{position:absolute;border-radius:50%;animation:float linear infinite;opacity:.5}
@keyframes float{0%{transform:translateY(0) rotate(0deg);opacity:.5}100%{transform:translateY(-100vh) rotate(360deg);opacity:0}}

#app{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:12px 12px 80px}

.header{text-align:center;padding:14px 0 6px}
.logo{font-size:24px;font-weight:900;background:linear-gradient(135deg,#0B5FA5,#1380C9,#1E8449);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-.5px}
.subtitle{font-size:12px;color:var(--muted);margin-top:3px;font-weight:600}
.ctu-ribbon{height:4px;max-width:160px;margin:8px auto 0;border-radius:3px;background:linear-gradient(90deg,#0B5FA5,#0E7C76,#1E8449)}

/* Timer bar */
.timer-bar{position:fixed;top:0;left:0;width:100%;height:5px;background:var(--border);z-index:100}
.timer-fill{height:100%;background:linear-gradient(90deg,#0B5FA5,#1E8449);transition:width 1s linear;border-radius:0 2px 2px 0}
.timer-display{position:fixed;top:8px;right:12px;z-index:101;background:rgba(255,255,255,.95);border:1.5px solid var(--border);border-radius:20px;padding:4px 12px;font-size:13px;font-weight:800;color:var(--accent);font-family:'Nunito',sans-serif;box-shadow:0 2px 8px var(--shadow)}
.timer-display.urgent{color:var(--red);animation:pulse-red .6s infinite}
@keyframes pulse-red{0%,100%{opacity:1}50%{opacity:.5}}

/* Arena robots */
.arena{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:6px 0 10px}
.robot-wrap{flex-shrink:0;position:relative}
.robot-wrap svg{width:68px;height:84px;filter:drop-shadow(0 4px 12px rgba(11,95,165,.2))}

.card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 4px 20px var(--shadow)}
.card-title{font-size:12px;font-weight:800;color:var(--warm);letter-spacing:.06em;text-transform:uppercase;margin-bottom:12px}

/* Tab row */
.tab-row{display:flex;gap:6px;margin-bottom:14px}
.tab{flex:1;padding:9px 4px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:12px;font-family:'Nunito',sans-serif;cursor:pointer;text-align:center;transition:.2s;font-weight:700}
.tab.active{border-color:var(--accent);color:var(--accent);background:rgba(11,95,165,.08)}
.tab.done{border-color:var(--green);color:var(--green);background:rgba(30,132,73,.08)}

.question-badge{display:inline-block;background:linear-gradient(135deg,rgba(11,95,165,.15),rgba(30,132,73,.15));color:var(--accent);border-radius:10px;padding:4px 12px;font-size:11px;font-weight:800;margin-bottom:10px;border:1px solid rgba(11,95,165,.2)}
.question-text{font-size:14px;line-height:1.65;color:var(--text);margin-bottom:12px}

.editor-wrap{position:relative}
.editor-label{font-size:11px;color:var(--muted);margin-bottom:6px;font-family:'Fira Code',monospace;font-weight:600}
textarea{width:100%;min-height:120px;background:#F4F9FD;border:1.5px solid var(--border);border-radius:12px;color:#0B2942;font-family:'Fira Code',monospace;font-size:13px;padding:12px;resize:vertical;outline:none;line-height:1.6;transition:.2s}
textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,95,165,.1)}
textarea.saved{border-color:var(--green);background:rgba(30,132,73,.04)}

.btn-row{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;padding:12px;border-radius:12px;border:none;font-family:'Nunito',sans-serif;font-size:14px;font-weight:800;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,#0B5FA5,#1380C9);color:#fff;box-shadow:0 4px 16px rgba(11,95,165,.3)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(11,95,165,.4)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn-secondary{background:var(--surface2);color:var(--muted);border:1.5px solid var(--border)}
.btn-next{background:linear-gradient(135deg,var(--green),var(--green2));color:#fff;box-shadow:0 4px 12px rgba(30,132,73,.25)}
.btn-teacher{background:linear-gradient(135deg,#2C4A86,#1B355F);color:#fff;box-shadow:0 4px 16px rgba(44,74,134,.3);font-size:13px}

.result-box{border-radius:14px;padding:14px;margin-top:10px;display:none;background:rgba(30,132,73,.08);border:1.5px solid rgba(30,132,73,.25)}
.result-box.show{display:block}
.result-fb{font-size:13px;line-height:1.6;color:var(--text);font-weight:600}

.loading-dots{display:inline-flex;gap:4px;align-items:center}
.loading-dots span{width:5px;height:5px;border-radius:50%;background:currentColor;animation:dot .9s infinite}
.loading-dots span:nth-child(2){animation-delay:.2s}
.loading-dots span:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{opacity:.2}40%{opacity:1}}

.name-input{width:100%;background:var(--surface2);border:1.5px solid var(--border);border-radius:12px;padding:12px 14px;color:var(--text);font-family:'Nunito',sans-serif;font-size:15px;font-weight:700;outline:none;margin-bottom:10px}
.name-input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(11,95,165,.1)}
.teacher-link{display:inline-block;background:none;border:none;color:var(--muted);font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;text-decoration:underline;text-decoration-color:var(--border);padding:6px}

.finish-banner{text-align:center;padding:20px 16px}
.finish-title{font-size:24px;font-weight:900;margin-bottom:6px;color:var(--text)}
.finish-sub{font-size:14px;color:var(--muted);margin-bottom:14px;font-weight:600}

.progress-bar{height:6px;background:var(--border);border-radius:3px;margin-bottom:14px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,#0B5FA5,#1E8449);border-radius:3px;transition:width .5s}

.hint-btn{font-size:11px;color:var(--accent);background:none;border:none;cursor:pointer;font-family:'Nunito',sans-serif;padding:0;margin-left:8px;font-weight:700}
.hint-box{background:rgba(19,128,201,.08);border:1.5px solid rgba(19,128,201,.25);border-radius:10px;padding:10px 12px;font-size:12px;color:#0B3F66;margin-top:8px;font-family:'Fira Code',monospace;display:none}
.hint-box.show{display:block}

@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes excited{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-14px) rotate(3deg)}}
@keyframes wave{0%,100%{transform:rotate(0deg) translateY(0)}25%{transform:rotate(12deg) translateY(-4px)}75%{transform:rotate(-12deg) translateY(-4px)}}
@keyframes idle-float{0%,100%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-5px) rotate(1deg)}}
.robot-bounce{animation:bounce 2s ease-in-out infinite}
.robot-excited{animation:excited .6s ease-in-out infinite}
.robot-idle{animation:idle-float 3s ease-in-out infinite}

/* ===== WAITING SCREEN ===== */
.wait-screen{text-align:center;padding:10px 0}
.wait-title{font-size:20px;font-weight:900;color:var(--accent);margin-bottom:4px}
.wait-sub{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:16px}

/* Player robo card */
.player-robo-card{background:var(--surface);border:2px solid var(--border);border-radius:20px;padding:14px 12px;text-align:center;position:relative;box-shadow:0 4px 16px var(--shadow)}
.player-robo-card.me{border-color:var(--accent)}
.player-name-tag{font-size:13px;font-weight:800;color:var(--text);margin-top:8px;background:var(--surface2);border-radius:8px;padding:4px 10px;display:inline-block}
.player-status{font-size:11px;color:var(--muted);margin-top:4px;font-weight:600}
.player-status.ready{color:var(--green)}
.ready-badge{position:absolute;top:-6px;right:-6px;background:var(--green);color:#fff;font-size:10px;font-weight:800;border-radius:20px;padding:2px 7px}

/* Waiting room grid */
.wait-room{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px;margin:12px 0}

/* Countdown overlay */
.countdown-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(241,247,252,.94);z-index:200;display:flex;align-items:center;justify-content:center;flex-direction:column}
.countdown-num{font-size:120px;font-weight:900;background:linear-gradient(135deg,#0B5FA5,#1E8449);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:count-pop .8s ease-out;line-height:1}
@keyframes count-pop{0%{transform:scale(2);opacity:0}60%{transform:scale(.9)}100%{transform:scale(1);opacity:1}}
.countdown-label{font-size:18px;font-weight:800;color:var(--muted);margin-top:8px}

/* Teacher panel & dashboard */
.teacher-panel{background:linear-gradient(135deg,rgba(44,74,134,.08),rgba(27,53,95,.06));border:1.5px solid rgba(44,74,134,.2);border-radius:16px;padding:14px;margin-bottom:12px}
.teacher-label{font-size:11px;font-weight:800;color:#2C4A86;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px}

.pin-screen{max-width:340px;margin:40px auto 0;text-align:center}
.monitor-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface2);border-radius:12px;border:1.5px solid var(--border);margin-bottom:8px;flex-wrap:wrap}
.monitor-name{flex:1;font-weight:800;font-size:14px;color:var(--text);min-width:70px}
.monitor-status{font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
.monitor-status.submitted{background:rgba(19,128,201,.15);color:#0B5FA5}
.monitor-status.done{background:rgba(30,132,73,.15);color:var(--green)}
.monitor-status.waiting{background:rgba(77,122,156,.12);color:var(--muted)}
.monitor-scores{display:flex;gap:4px}
.monitor-pip{width:22px;height:22px;border-radius:6px;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--muted);background:var(--border)}
.monitor-pip.ok{background:var(--green);color:#fff}
.watch-btn{background:none;border:1.5px solid var(--border);border-radius:8px;padding:5px 9px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;font-family:inherit}
.watch-modal-overlay{position:fixed;inset:0;background:rgba(11,41,66,.55);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px}
.watch-modal{background:var(--surface);border-radius:18px;padding:18px;max-width:480px;width:100%;max-height:85vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.watch-modal h3{font-size:15px;font-weight:900;color:var(--accent);margin-bottom:10px}
.watch-q-title{font-size:12px;font-weight:800;color:var(--muted);margin-bottom:4px;margin-top:10px}
.watch-code{background:#F4F9FD;border:1.5px solid var(--border);border-radius:10px;padding:10px;font-family:'Fira Code',monospace;font-size:12px;white-space:pre-wrap;margin-bottom:6px;min-height:40px}
.publish-banner{text-align:center;padding:24px 16px;color:var(--muted);font-weight:700;font-size:14px}

/* Responsive */
@media(max-width:380px){
  #app{padding:8px 8px 80px}
  .wait-room{grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
  textarea{min-height:100px;font-size:12px}
}
@media(min-width:600px){
  #app{padding:16px 16px 80px}
  .arena .robot-wrap svg{width:80px;height:100px}
}

.pulse-ring{animation:pulse-ring 2s ease-out infinite}
@keyframes pulse-ring{0%{box-shadow:0 0 0 0 rgba(11,95,165,.4)}70%{box-shadow:0 0 0 12px rgba(11,95,165,0)}100%{box-shadow:0 0 0 0 rgba(11,95,165,0)}}

.emoji-rain{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:150}
.e-particle{position:absolute;top:-30px;font-size:24px;animation:rain-fall linear forwards}
@keyframes rain-fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}
</style>
</head>

<script>
// ===== FIREBASE CONFIG =====
// 👉 DÁN config Firebase (Realtime Database) của bạn vào đây — lấy ở:
// Firebase Console > Project settings (⚙) > General > Your apps > SDK setup and configuration
// Nhớ vào Build > Realtime Database > Create Database (chọn region gần VN: Singapore) để có databaseURL.
const firebaseConfig = {
  apiKey: "AIzaSyCbes_q1vRtaqRdzgi9BRKfgcQXh67tPOM",
  authDomain: "codingtrochoi.firebaseapp.com",
  databaseURL: "https://codingtrochoi-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "codingtrochoi",
  storageBucket: "codingtrochoi.firebasestorage.app",
  messagingSenderId: "682497417035",
  appId: "1:682497417035:web:f88c724d44af1ea17092ce",
  measurementId: "G-J5W0JZ3E28"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
// Đường dẫn gốc trong Database — đổi tên nếu muốn nhiều lớp/buổi học không bị trộn dữ liệu
const ARENA_ROOT = 'code_arena_v4';

// ===== GAME CONFIG =====
const TOTAL_SECONDS = 300; // 5 phút
// 👉 Mã PIN để vào khu vực Giáo viên — đổi mã này trước khi dùng trên lớp!
const TEACHER_PIN = '2025';

// ===== ROBOT COLOR PALETTE FOR PLAYERS =====
const ROBOT_COLORS = [
  {main:'#0B5FA5',eye:'#1E8449',body:'#EAF3FB',border:'#0B5FA5'},
  {main:'#1E8449',eye:'#0B5FA5',body:'#EAF6EF',border:'#1E8449'},
  {main:'#6D4FC2',eye:'#9C89D9',body:'#F0ECF7',border:'#6D4FC2'},
  {main:'#C6922E',eye:'#E1C27A',body:'#FBF6E8',border:'#C6922E'},
  {main:'#C0392B',eye:'#D98A85',body:'#F8EDEC',border:'#C0392B'},
  {main:'#0E7C76',eye:'#7FC4C2',body:'#E9F4F3',border:'#0E7C76'},
  {main:'#A8456B',eye:'#D98AAE',body:'#F8ECF1',border:'#A8456B'},
  {main:'#3B6FB5',eye:'#7CA8DE',body:'#EDF2F8',border:'#3B6FB5'},
];

function getRobotColor(name) {
  let hash = 0;
  for(let c of name) hash = (hash*31 + c.charCodeAt(0)) & 0xFFFF;
  return ROBOT_COLORS[hash % ROBOT_COLORS.length];
}

function makeRobot(name, size=56, mood='idle') {
  const c = getRobotColor(name);
  const anim = mood==='excited' ? 'robot-excited' : mood==='wave' ? 'robot-bounce' : 'robot-idle';
  return `<svg width="${size}" height="${Math.round(size*1.25)}" viewBox="0 0 64 80" fill="none" class="${anim}" style="filter:drop-shadow(0 3px 8px ${c.main}40)">

// ===== ESCAPE HELPER (chống lỗi hiển thị / chèn mã độc từ tên hoặc code của học sinh) =====
function escapeHtml(str) {
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// ===== FIREBASE REFS & HELPERS =====
function sanitizeKey(name) {
  const k = String(name).trim().replace(/[.#$\[\]\/]/g, '_').slice(0, 40);
  return k || ('hs_' + Math.random().toString(36).slice(2,8));
}
function studentsRef() { return db.ref(`${ARENA_ROOT}/students`); }
function studentRef(key) { return db.ref(`${ARENA_ROOT}/students/${key}`); }
function gameRef() { return db.ref(`${ARENA_ROOT}/game`); }

// Theo dõi các listener Firebase đang hoạt động để tắt đúng lúc khi chuyển màn hình
let activeOffFns = [];
function clearActiveListeners() {
  activeOffFns.forEach(fn => { try { fn(); } catch(e){} });
  activeOffFns = [];
}

async function joinOrResumeStudent(name, key) {
  let resumedCodes = questions.map(()=>'');
  let resumedSubmitted = questions.map(()=>false);
  try {
    const snap = await studentRef(key).once('value');
    if (snap.exists()) {
      const data = snap.val();
      if (Array.isArray(data.codes)) resumedCodes = questions.map((_,i)=>data.codes[i]||'');
      if (Array.isArray(data.submitted)) resumedSubmitted = questions.map((_,i)=>!!data.submitted[i]);
    }
    await studentRef(key).update({
      name,
      joinedAt: firebase.database.ServerValue.TIMESTAMP,
      codes: resumedCodes,
      submitted: resumedSubmitted,
      finished: false,
      finishedAt: null
    });
  } catch(e) {}
  return { codes: resumedCodes, submitted: resumedSubmitted };
}

let saveDebounceTimer = null;
function scheduleSaveCode(key, qIdx, code) {
  state.codes[qIdx] = code;
  clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(() => {
    studentRef(key).update({ [`codes/${qIdx}`]: code, updatedAt: firebase.database.ServerValue.TIMESTAMP }).catch(()=>{});
  }, 1000);
}

// ===== TIMER =====
function updateTimerUI() {
  const m = Math.floor(state.secondsLeft/60);
  const s = String(state.secondsLeft%60).padStart(2,'0');
  const disp = document.getElementById('timerDisplay');
  const fill = document.getElementById('timerFill');
  if(disp) {
    disp.textContent = `⏱ ${m}:${s}`;
    disp.classList.toggle('urgent', state.secondsLeft <= 30);
  }
  if(fill) fill.style.width = Math.max(0, state.secondsLeft/TOTAL_SECONDS*100)+'%';
}

function startTimer(onDone, startSeconds) {
  state.secondsLeft = (startSeconds != null) ? startSeconds : TOTAL_SECONDS;
  const disp = document.getElementById('timerDisplay');
  if(disp) disp.style.display = 'block';
  updateTimerUI();
  if(state.timerInterval) clearInterval(state.timerInterval);
  if(state.secondsLeft <= 0) { if(onDone) onDone(); return; }
  state.timerInterval = setInterval(() => {
    state.secondsLeft--;
    updateTimerUI();
    if(state.secondsLeft <= 0) {
      clearInterval(state.timerInterval);
      if(onDone) onDone();
    }
  }, 1000);
}

function stopTimer() {
  if(state.timerInterval) clearInterval(state.timerInterval);
}

// ===== ROBOT MOOD =====
function setRobotMood(mood) {
  ['robot-left','robot-right'].forEach(id => {
    const el = document.getElementById(id);
    if(!el) return;
    const svg = el.querySelector('svg');
    if(!svg) return;
    const flip = id === 'robot-right' ? ' transform:scaleX(-1)' : '';
    svg.removeAttribute('class');
    if(mood==='excited') svg.setAttribute('class','robot-excited');
    else if(mood==='idle') svg.setAttribute('class','robot-bounce');
    else svg.setAttribute('class','robot-idle');
  });
}

// ===== EMOJI RAIN =====
function emojiRain(emojis=['🎉','⭐','🚀','🔥','✨'], count=18) {
  const rain = document.getElementById('emojiRain');
  rain.innerHTML='';
  for(let i=0;i<count;i++){
    const e = document.createElement('span');
    e.className='e-particle';
    e.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    e.style.cssText=`left:${Math.random()*100}%;animation-duration:${1.5+Math.random()*2}s;animation-delay:${Math.random()*.8}s;font-size:${16+Math.random()*20}px`;
    rain.appendChild(e);
  }
  setTimeout(()=>rain.innerHTML='', 4000);
}

function renderWaitingScreen() {
  state.screen = 'waiting';

  document.getElementById('center-area').innerHTML = `
    <div style="font-size:15px;font-weight:900;color:var(--accent)">Phòng chờ</div>
    <div style="font-size:11px;color:var(--muted);font-weight:600">Đợi giáo viên bắt đầu...</div>`;
  document.getElementById('main-content').innerHTML = `
  <div class="card wait-screen">
    <div class="wait-title">🕐 Đang chờ bắt đầu...</div>
    <div class="wait-sub">Giáo viên sẽ bấm nút để bắt đầu cùng lúc</div>

    <div style="background:var(--surface2);border-radius:14px;padding:12px;margin-bottom:12px">
      <div style="font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">🤖 Học sinh trong phòng (<span id="waitCount">0</span>)</div>
      <div class="wait-room" id="waitGrid"><div style="grid-column:1/-1;color:var(--muted);font-weight:600;font-size:12px">Đang tải...</div></div>
    </div>

    <div style="font-size:13px;color:var(--muted);font-weight:700;text-align:center">
      ⏱ Thời gian thi: <span style="color:var(--accent)">5 phút</span>
    </div>
  </div>`;

  let transitioned = false;

  const onStudents = (snap) => {
    const data = snap.val() || {};
    const grid = document.getElementById('waitGrid');
    const countEl = document.getElementById('waitCount');
    if(!grid) return;
    const names = Object.values(data).map(s => s.name).filter(Boolean);
    if(countEl) countEl.textContent = names.length;
    grid.innerHTML = names.length ? names.map(name => `
      <div class="player-robo-card${name===state.playerName?' me':''}">
        ${name===state.playerName?'<div class="ready-badge">Bạn</div>':''}
        ${makeRobo(name, 50, 'wave')}
        <div class="player-name-tag">${escapeHtml(name.length>8?name.slice(0,8)+'…':name)}</div>
        <div class="player-status ready">✓ Sẵn sàng</div>
      </div>`).join('') : `<div style="grid-column:1/-1;color:var(--muted);font-weight:600;font-size:12px">Chưa có bạn nào...</div>`;
  };
  studentsRef().on('value', onStudents);
  activeOffFns.push(() => studentsRef().off('value', onStudents));

  const onGame = (snap) => {
    if(transitioned) return;
    const g = snap.val() || {};
    if(g.started) {
      transitioned = true;
      clearActiveListeners();
      const startAt = g.startAt || Date.now();
      const elapsedMs = Date.now() - startAt;
      if(elapsedMs < 4000) {
        startCountdown();
      } else {
        const remain = Math.max(0, TOTAL_SECONDS - Math.floor(elapsedMs/1000));
        if(remain <= 0) { timeUp(); }
        else { enterGameDirect(remain); }
      }
    }
  };
  gameRef().on('value', onGame);
  activeOffFns.push(() => gameRef().off('value', onGame));
}

function enterGameDirect(remainSeconds) {
  state.startTime = Date.now() - (TOTAL_SECONDS - remainSeconds) * 1000;
  state.screen = 'game';
  renderGameScreen();
  startTimer(() => timeUp(), remainSeconds);
}

// -- COUNTDOWN --
function startCountdown() {
  let n = 3;
  const overlay = document.createElement('div');
  overlay.className = 'countdown-overlay';
  overlay.id = 'countdownOverlay';
  overlay.innerHTML = `<div class="countdown-num" id="countNum">${n}</div><div class="countdown-label">Chuẩn bị...</div>`;
  document.body.appendChild(overlay);

  const tick = () => {
    n--;
    if(n > 0) {
      const el = document.getElementById('countNum');
      if(el) { el.style.animation='none'; el.offsetWidth; el.style.animation='count-pop .8s ease-out'; el.textContent=n; }
      setTimeout(tick, 900);
    } else {
      const el = document.getElementById('countNum');
      if(el) { el.style.animation='none'; el.offsetWidth; el.style.animation='count-pop .5s ease-out'; el.textContent='🚀 Bắt đầu!'; el.style.fontSize='48px'; }
      setTimeout(() => {
        overlay.remove();
        state.startTime = Date.now();
        state.screen = 'game';
        renderGameScreen();
        startTimer(() => timeUp());
      }, 900);
    }
  };
  setTimeout(tick, 900);
}

// -- TIME UP --
async function timeUp() {
  if(state.screen === 'finish') return;
  setRobotMood('idle');
  const ed = document.getElementById('codeEditor');
  if(ed) state.codes[state.currentQ] = ed.value;
  try {
    await studentRef(state.studentKey).update({
      codes: state.codes,
      finished: true,
      finishedAt: firebase.database.ServerValue.TIMESTAMP,
      autoFinished: true
    });
  } catch(e) {}
  state.screen = 'finish';
  renderFinishScreen(true);
}

  document.getElementById('hint-box').classList.toggle('show');

  document.getElementById('codeEditor').value = '';

  state.codes[state.currentQ] = '';

async function submitCode() {
  const code = document.getElementById('codeEditor').value;
  if(!code.trim()){ alert('Hãy viết code trước khi nộp nhé! 💻'); return; }
  state.codes[state.currentQ] = code;
  clearTimeout(saveDebounceTimer);
  try {
    await studentRef(state.studentKey).update({
      [`codes/${state.currentQ}`]: code,
      [`submitted/${state.currentQ}`]: true,
      updatedAt: firebase.database.ServerValue.TIMESTAMP
    });
  } catch(e) {}
  state.submitted[state.currentQ] = true;
  setRobotMood('excited');
  emojiRain(['✅','💾','🎉'], 14);
  setTimeout(()=>setRobotMood('idle'), 2000);
  renderGameScreen();
}

    <div class="card">
      <div class="card-title" style="display:flex;align-items:center;justify-content:space-between">
        <span>🤖 Học sinh (<span id="studentCount">0</span>)</span>
        <button class="btn btn-secondary" style="flex:none;padding:5px 10px;font-size:11px" onclick="backToHome()">← Thoát</button>
      </div>
      <div id="teacher-student-list"></div>
    </div>`;

  const onGame = (snap) => { teacherData.game = snap.val() || {started:false,startAt:null}; renderTeacherStatusCard(); };
  const onStud = (snap) => { teacherData.students = snap.val() || {}; renderTeacherStudentList(); };
  gameRef().on('value', onGame);
  studentsRef().on('value', onStud);
  activeOffFns.push(() => gameRef().off('value', onGame));
  activeOffFns.push(() => studentsRef().off('value', onStud));

  if(teacherClockInterval) clearInterval(teacherClockInterval);
  teacherClockInterval = setInterval(renderTeacherStatusCard, 1000);
  activeOffFns.push(() => { if(teacherClockInterval) clearInterval(teacherClockInterval); });
}

function renderTeacherStatusCard() {
  const el = document.getElementById('teacher-status-card');
  if(!el) return;
  const g = teacherData.game;
  let timeInfo = '';
  if(g.started && g.startAt) {
    const elapsed = Math.floor((Date.now() - g.startAt)/1000);
    const remain = Math.max(0, TOTAL_SECONDS - elapsed);
    const m = Math.floor(remain/60), s = String(remain%60).padStart(2,'0');
    timeInfo = remain>0 ? ` · ⏱ Còn lại ${m}:${s}` : ' · ⏰ Đã hết giờ';
  }
  el.innerHTML = `
  <div class="card teacher-panel">
    <div class="teacher-label">📡 Trạng thái trò chơi</div>
    <div style="font-size:15px;font-weight:800;color:var(--teacher);margin-bottom:10px">
      ${g.started ? '🟢 Đang diễn ra' + timeInfo : '⚪ Chưa bắt đầu'}
    </div>
    <div class="btn-row">
      ${g.started
        ? `<button class="btn btn-secondary" onclick="teacherEndReset()">⏹ Kết thúc &amp; Reset lớp</button>`
        : `<button class="btn btn-teacher" onclick="teacherStart()">▶ Bắt đầu cho tất cả học sinh</button>`}
    </div>
  </div>`;
}

function renderTeacherStudentList() {
  const list = Object.entries(teacherData.students).map(([key,s]) => ({key, ...s}));
  list.sort((a,b) => (a.joinedAt||0) - (b.joinedAt||0));
  const countEl = document.getElementById('studentCount');
  if(countEl) countEl.textContent = list.length;
  const wrap = document.getElementById('teacher-student-list');
  if(!wrap) return;
  if(!list.length) { wrap.innerHTML = `<div class="publish-banner">Chưa có học sinh nào tham gia 🤖</div>`; return; }
  wrap.innerHTML = list.map(s => {
    const subs = Array.isArray(s.submitted) ? s.submitted : questions.map(()=>false);
    const pips = questions.map((_,i) => `<span class="monitor-pip ${subs[i]?'ok':''}" title="Câu ${i+1}">${i+1}</span>`).join('');
    const statusLabel = s.finished
      ? `<span class="monitor-status done">✓ Hoàn thành</span>`
      : subs.some(Boolean)
      ? `<span class="monitor-status submitted">Đang làm</span>`
      : `<span class="monitor-status waiting">Chưa nộp</span>`;
    return `<div class="monitor-row">
      <div style="flex-shrink:0">${makeRobot(s.name||'?',34,'idle')}</div>
      <div class="monitor-name">${escapeHtml(s.name||'?')}</div>
      <div class="monitor-scores">${pips}</div>
      ${statusLabel}
      <button class="watch-btn" onclick="openWatchModal('${s.key}')">👁 Xem code</button>
    </div>`;
  }).join('');
}

function openWatchModal(key) {
  const s = teacherData.students[key];
  if(!s) return;
  const codes = Array.isArray(s.codes) ? s.codes : questions.map(()=>'');
  const subs = Array.isArray(s.submitted) ? s.submitted : questions.map(()=>false);
  const overlay = document.createElement('div');
  overlay.className = 'watch-modal-overlay';
  overlay.id = 'watchOverlay';
  overlay.onclick = (e) => { if(e.target === overlay) closeWatchModal(); };
  overlay.innerHTML = `
    <div class="watch-modal">
      <h3>👀 Code của ${escapeHtml(s.name||'?')}</h3>
      ${questions.map((q,i) => `
        <div class="watch-q-title">Câu ${i+1}: ${escapeHtml(q.title)} ${subs[i] ? '· ✅ Đã nộp' : '· ⏳ Chưa nộp'}</div>
        <div class="watch-code">${codes[i] ? escapeHtml(codes[i]) : '(chưa viết code)'}</div>
      `).join('')}
      <button class="btn btn-secondary" style="width:100%;margin-top:6px" onclick="closeWatchModal()">Đóng</button>
    </div>`;
  document.body.appendChild(overlay);
}

function closeWatchModal() {
  const el = document.getElementById('watchOverlay');
  if(el) el.remove();
}

async function teacherStart() {
  if(!confirm('Xác nhận bắt đầu trò chơi cho tất cả học sinh?')) return;
  try {
    await gameRef().set({ started:true, startAt: firebase.database.ServerValue.TIMESTAMP });
  } catch(e) { alert('Không thể kết nối Firebase. Hãy kiểm tra lại firebaseConfig.'); }
}

async function teacherEndReset() {
  if(!confirm('⚠️ Kết thúc và xoá toàn bộ dữ liệu lớp (phòng chờ + code đã nộp)? Hành động này không thể hoàn tác.')) return;
  try {
    await gameRef().set({ started:false, startAt:null });
    await studentsRef().remove();
    alert('✅ Đã reset! Học sinh có thể vào lại từ đầu.');
  } catch(e) {}
}

// ===== INIT =====
renderNameScreen();
</script>
